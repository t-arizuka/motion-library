<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion Library — WordPress Layer Test</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;font-family:system-ui,sans-serif}.note{padding:18px 28px;color:#475569;background:#fff;font-size:14px;line-height:1.7}.hero{position:relative;width:100%;max-width:100%;margin:0 auto;height:clamp(320px,70vh,760px);isolation:isolate;overflow:hidden;background:#223}.hero iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}.copy{position:relative;z-index:1;height:100%;min-height:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:clamp(24px,7vw,110px);color:white;text-shadow:0 2px 24px #17233755}.copy h1{font-size:clamp(30px,4.2vw,64px);margin:0 0 16px}.copy p{font-size:clamp(14px,1.2vw,18px)}.copy a{display:inline-block;margin-top:24px;background:white;color:#263242;padding:14px 24px;text-shadow:none;text-decoration:none;border-radius:4px}</style></head><body><div class="note">ローカル検証：背景はiframe／文字とリンクはWordPress相当のHTMLレイヤーです。ボタンをクリックできるか確認してください。</div><section class="hero"><iframe id="bg" title="動く背景" aria-hidden="true" tabindex="-1" loading="eager"></iframe><div class="copy"><h1>新しい未来を、ここから。</h1><p>キャッチコピーとボタンは背景から独立して編集できます。</p><a href="#test-target">詳しく見る →</a></div></section><div class="note" id="test-target">ボタンの遷移先（テスト用）</div><script>const u=new URL('embed.html',location.href);const data=new URLSearchParams(location.search).get('data');if(data)u.searchParams.set('data',data);const params=new URLSearchParams(location.search);const w=Number(params.get('w')),h=Number(params.get('h')),hero=document.querySelector('.hero');if(params.get('w')==='100%')hero.style.maxWidth='100%';else if(Number.isInteger(w)&&w>=320&&w<=2560)hero.style.maxWidth=w+'px';if(Number.isInteger(h)&&h>=360&&h<=1200)hero.style.height='clamp(320px,70vh,'+h+'px)';document.getElementById('bg').src=u.href;</script></body></html>
